name: Build launcher com.ts.launcher (MiTV-MTEQ0)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK with package id com.ts.launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PlauncherApplicationId=com.ts.launcher
          cp app/build/outputs/apk/release/app-release.apk ../ts-launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ts-launcher
          path: ts-launcher.apk
